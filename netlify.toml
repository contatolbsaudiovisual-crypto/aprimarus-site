# ── Cabeçalhos de segurança ─────────────────────────────────────────────
# Site público estático (marketing + blog + bounce do TikTok). Sem cookies,
# sem auth, sem input de usuário salvo — exceto o painel /admin (Decap CMS).

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy ="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://region1.google-analytics.com https://*.google-analytics.com; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

# O painel do CMS precisa carregar o Decap (unpkg), o widget de identidade da
# Netlify e falar com a API do GitHub. CSP própria, mais permissiva, só aqui.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://identity.netlify.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; img-src 'self' data: blob: https://*.githubusercontent.com https://avatars.githubusercontent.com https://*.gravatar.com; font-src 'self' data: https://unpkg.com https://fonts.gstatic.com; connect-src 'self' https://api.github.com https://uploads.github.com https://identity.netlify.com https://api.netlify.com https://*.netlify.app https://*.netlify.com https://unpkg.com; frame-ancestors 'none'; base-uri 'self'"
