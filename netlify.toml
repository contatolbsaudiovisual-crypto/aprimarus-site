# ── Cabeçalhos de segurança ─────────────────────────────────────────────
# Site 100% estático (marketing + blog + bounce do TikTok). Sem cookies,
# sem auth, sem CMS, sem input de usuário salvo. Posts do blog entram por
# git commit (ver AGENTS.md / fluxo com o Claude).

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.clarity.ms https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com https://*.clarity.ms https://c.bing.com https://i.ytimg.com; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://region1.google-analytics.com https://*.google-analytics.com https://*.clarity.ms https://c.bing.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

# Imagens de public/ não têm hash no nome — cache longo com prazo fechado.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /admin e a página de convite do CMS não existem mais — manda pra home.
[[redirects]]
  from = "/admin/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/aceitar-convite"
  to = "/"
  status = 301
  force = true
