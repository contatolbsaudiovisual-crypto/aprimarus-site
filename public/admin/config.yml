backend:
  name: git-gateway
  branch: main

site_url: https://aprimarus.com.br
display_url: https://aprimarus.com.br

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Posts do Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descrição (SEO, ~155 caracteres)", name: "description", widget: "text" }
      - label: "Resumo (40-60 palavras, resposta direta à pergunta do post)"
        name: "resumo"
        widget: "text"
        hint: "Trecho que o Google e as IAs generativas costumam citar. Responda a pergunta principal do post aqui, de forma direta."
      - { label: "Data de publicação", name: "pubDate", widget: "datetime" }
      - { label: "Data de atualização", name: "updatedDate", widget: "datetime", required: false }
      - { label: "Autor", name: "author", widget: "string", default: "Leonardo Di Bartolomeo" }
      - { label: "Imagem de capa", name: "heroImage", widget: "image", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - label: "Perguntas frequentes (FAQ)"
        name: "faq"
        widget: "list"
        required: false
        fields:
          - { label: "Pergunta", name: "pergunta", widget: "string" }
          - { label: "Resposta", name: "resposta", widget: "text" }
      - { label: "Corpo do post", name: "body", widget: "markdown" }
